<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 20px;
      width: 320px;
      text-align: center;
    }
    input[type="number"] {
      width: 60px;
      text-align: center;
      padding: 5px;
      margin-left: 10px;
    }
    button {
      padding: 10px 15px;
      margin-top: 15px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #2563eb;
    }
    .password-box {
      margin-top: 15px;
      padding: 10px;
      background-color: #e5e7eb;
      border-radius: 4px;
      font-family: monospace;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .password-box span {
      word-break: break-all;
      user-select: all;
    }
    .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #374151;
      margin-left: 5px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Barcode Generator</h1>
  <div style="margin-top:10px;">
    <label>바코드 길이 (1~50):
      <input type="number" id="length" value="20" min="1" max="50">
    </label>
  </div>
  <button id="generate">바코드 생성 (자동 복사)</button>

  <div class="password-box" id="passwordBox" style="display:none;">
    <span id="password"></span>
    <button class="copy-btn" id="copyBtn">📋</button>
  </div>
</div>

<script>
  const generateBtn = document.getElementById('generate');
  const passwordBox = document.getElementById('passwordBox');
  const passwordSpan = document.getElementById('password');
  const copyBtn = document.getElementById('copyBtn');
  const lengthInput = document.getElementById('length');

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert('비밀번호가 복사되었습니다!');
    }).catch(() => {
      alert('복사에 실패했습니다.');
    });
  }

  function generatePassword() {
    const chars = ['I', 'l'];
    let length = parseInt(lengthInput.value);
    if (isNaN(length) || length < 1) length = 1;
    if (length > 50) length = 50;

    let result = '';
    for (let i = 0; i < length; i++) {
      result += chars[Math.floor(Math.random() * chars.length)];
    }

    passwordSpan.textContent = result;
    passwordBox.style.display = 'flex';
    copyToClipboard(result); // 자동 복사
  }

  generateBtn.addEventListener('click', generatePassword);
  copyBtn.addEventListener('click', () => copyToClipboard(passwordSpan.textContent));
</script>

</body>
</html>
